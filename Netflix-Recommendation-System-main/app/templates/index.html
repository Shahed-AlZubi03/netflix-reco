<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ReelMatch Studio | Netflix Curator</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<link rel="stylesheet" href="{{ url_for('static', filename='stylesheets/base.css') }}">
	<style>
		:root {
			--netflix-red: #E50914;
			--bg-color: #050505;
			--modal-bg: rgba(18, 18, 24, 0.75); /* More translucent for glass effect */
			--border-color: rgba(255, 255, 255, 0.08);
			--text-color: #ffffff;
			--text-muted: #9ba0a6;
		}
		
		body {
			background-color: var(--bg-color);
			margin: 0;
			overflow: hidden; /* prevent scrolling on background */
			font-family: 'Inter', sans-serif;
			color: #fff;
		}

		/* Topbar */
		.topbar {
			position: absolute;
			top: 0; left: 0; width: 100%;
			padding: 1.5rem 3rem;
			display: flex;
			justify-content: space-between;
			align-items: center;
			z-index: 100;
			box-sizing: border-box;
			background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
		}
		.brand {
			display: flex;
			align-items: center;
			gap: 1rem;
			text-decoration: none;
			color: #fff;
			font-family: 'Bebas Neue', sans-serif;
			font-size: 1.8rem;
			letter-spacing: 1px;
		}
		.brand img { height: 32px; }

		/* Background Grid of All Movies */
		.background-grid {
			position: absolute;
			top: -10%; left: -5%;
			width: 110%; height: 120%;
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			opacity: 0.35;
			filter: blur(3px) brightness(0.6);
			transform: scale(1.05) rotate(-2deg);
			pointer-events: none;
			z-index: 1;
		}
		.poster {
			width: calc(10% - 10px);
			aspect-ratio: 2 / 3;
			background-color: #222;
			border-radius: 4px;
			background-size: cover;
			background-position: center;
			box-shadow: 0 4px 10px rgba(0,0,0,0.5);
			animation: floatPoster 15s infinite alternate ease-in-out;
		}
		/* Stagger animations for posters */
		.poster:nth-child(2n) { animation-delay: -2s; animation-duration: 18s; }
		.poster:nth-child(3n) { animation-delay: -5s; animation-duration: 20s; }
		.poster:nth-child(5n) { animation-delay: -7s; animation-duration: 14s; }

		@keyframes floatPoster {
			0% { transform: translateY(0); }
			100% { transform: translateY(-30px); }
		}

		/* Modal Popup */
		.modal-overlay {
			position: fixed;
			top: 0; left: 0; width: 100%; height: 100%;
			background: radial-gradient(circle at center, rgba(10,10,15,0.6) 0%, rgba(0,0,0,0.95) 100%);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			z-index: 50;
			display: flex;
			justify-content: center;
			align-items: center;
			animation: fadeIn 0.6s ease-out forwards;
		}

		@keyframes fadeIn {
			from { opacity: 0; background: rgba(0,0,0,0); backdrop-filter: blur(0px); }
			to { opacity: 1; }
		}

		.modal-box {
			position: relative;
			background: var(--modal-bg);
			border-radius: 20px;
			padding: 3.5rem 3rem;
			width: 100%;
			max-width: 520px;
			box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 1px inset rgba(255,255,255,0.05);
			transform: translateY(30px) scale(0.95);
			animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
			opacity: 0;
			box-sizing: border-box;
		}

		/* Glowing edge at the top */
		.modal-box::before {
			content: '';
			position: absolute;
			top: 0; left: 0; right: 0; height: 1px;
			background: linear-gradient(90deg, transparent 0%, rgba(229, 9, 20, 0.4) 50%, transparent 100%);
			border-radius: 20px 20px 0 0;
			z-index: 10;
		}

		@keyframes slideUp {
			from { transform: translateY(30px) scale(0.95); opacity: 0; }
			to { transform: translateY(0) scale(1); opacity: 1; }
		}

		.modal-box h2 {
			font-size: 2.2rem;
			margin: 0 0 0.75rem 0;
			font-family: 'Bebas Neue', 'Inter', sans-serif;
			letter-spacing: 1.5px;
			text-align: center;
			text-transform: uppercase;
			background: linear-gradient(to bottom right, #ffffff, #aaaaaa);
			background-clip: text;
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			text-shadow: 0 2px 10px rgba(0,0,0,0.2);
		}

		.modal-box p.lead {
			color: var(--text-muted);
			text-align: center;
			margin-bottom: 2.5rem;
			font-size: 0.95rem;
			line-height: 1.6;
			font-weight: 400;
		}

		.field-block {
			margin-bottom: 1.8rem;
			text-align: left;
		}
		.field-meta {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 0.5rem;
			font-size: 0.85rem;
			font-weight: 500;
			color: #dddddd;
		}
		.field-chip {
			font-size: 0.65rem;
			padding: 3px 8px;
			border-radius: 4px;
			background: rgba(255,255,255,0.06);
			color: #a0a0a0;
			text-transform: uppercase;
			letter-spacing: 0.5px;
			font-weight: 600;
		}
		.field-chip-required {
			background: rgba(229, 9, 20, 0.1);
			color: #ff525c;
		}

		.primary-btn {
			width: 100%;
			padding: 1.1rem;
			background: linear-gradient(135deg, #e50914 0%, #b8050e 100%);
			color: white;
			border: none;
			border-radius: 8px;
			font-size: 1.05rem;
			font-weight: 600;
			letter-spacing: 0.5px;
			cursor: pointer;
			margin-top: 1rem;
			transition: all 0.3s ease;
			box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 8px;
		}
		.primary-btn:hover { 
			background: linear-gradient(135deg, #f40612 0%, #d10510 100%);
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(229, 9, 20, 0.4);
		}
		.primary-btn:active { 
			transform: translateY(1px); 
			box-shadow: 0 2px 10px rgba(229, 9, 20, 0.3);
		}

		/* Select2 Dark Theme Overrides */
		.select2-container--default .select2-selection--multiple {
			background-color: rgba(255, 255, 255, 0.05);
			border: 1px solid var(--border-color);
			border-radius: 8px;
			min-height: 48px;
			padding: 4px 8px;
			transition: border-color 0.2s, box-shadow 0.2s;
		}
		.select2-container--default.select2-container--focus .select2-selection--multiple {
			border-color: rgba(229, 9, 20, 0.5);
			background-color: rgba(255, 255, 255, 0.08);
			box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.15);
		}
		.select2-container--default .select2-selection--multiple .select2-selection__choice {
			background-color: rgba(255, 255, 255, 0.1);
			border: 1px solid rgba(255, 255, 255, 0.15);
			color: #fff;
			border-radius: 4px;
			padding: 4px 8px;
			margin-top: 6px;
			font-size: 0.9rem;
			display: flex;
			align-items: center;
			backdrop-filter: blur(5px);
		}
		.select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
			color: #aaa;
			margin-right: 6px;
			border-right: none;
			padding-right: 0;
			font-size: 1.1rem;
			line-height: 1;
		}
		.select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover {
			color: #fff;
			background: none;
		}
		.select2-search__field {
			color: #fff !important;
			font-family: 'Inter', sans-serif;
			margin-top: 8px !important;
		}
		.select2-container--default .select2-search--inline .select2-search__field::placeholder {
			color: #777;
		}
		.select2-dropdown {
			background-color: #1a1a20;
			border: 1px solid var(--border-color);
			border-radius: 8px;
			box-shadow: 0 10px 25px rgba(0,0,0,0.5);
			overflow: hidden;
		}
		.select2-results__option {
			padding: 10px 15px;
			color: #ccc;
			font-size: 0.95rem;
			border-bottom: 1px solid rgba(255, 255, 255, 0.03);
			transition: background 0.1s, color 0.1s;
		}
		.select2-container--default .select2-results__option--highlighted.select2-results__option--selectable {
			background-color: rgba(229, 9, 20, 0.15);
			color: #fff;
		}
		.select2-container--default .select2-results__option[aria-selected=true] {
			background-color: rgba(255, 255, 255, 0.08);
			color: #fff;
		}
		.select2-results__option:last-child {
			border-bottom: none;
		}

	</style>
</head>
<body>
	<header class="topbar">
		<a class="brand" href="{{ url_for('dashboard') }}">
			<img src="{{ url_for('static', filename='stylesheets/logo.svg') }}" alt="Netflix logo">
			<span>ReelMatch Studio</span>
		</a>
		<a href="{{ url_for('logout') }}" class="ghost-link" style="color: #aaa; text-decoration: none; font-size: 0.9rem;">Sign Out</a>
	</header>

	<!-- Massive grid of all movies & series in the background -->
	<div class="background-grid">
		{% for item in all_movies %}
			{% if item.Image %}
			<div class="poster" style="background-image: url('{{ item.Image }}');" title="{{ item.Title }}"></div>
			{% endif %}
		{% endfor %}
	</div>

	<!-- Popup Message Modal asking for Types and Language -->
	<div class="modal-overlay">
		<div class="modal-box">
			<h2>What are you in the mood for?</h2>
			<p class="lead">Tell us the type/s of film and your preferred language, and we'll show you the most similar movies or series that match your requirement.</p>
			
			<form id="preference-form" action="{{ url_for('recommendations') }}" method="post">
				<div class="field-block">
					<div class="field-meta">
						<label for="titles">Type/s or Title/s of Film</label>
						<span class="field-chip field-chip-required">Required</span>
					</div>
					<select name="titles" multiple id="titles" required>
						{% for title in titles %}
						<option value="{{ title }}">{{ title }}</option>
						{% endfor %}
					</select>
				</div>

				<div class="field-block">
					<div class="field-meta">
						<label for="languages">Language</label>
						<span class="field-chip">Optional</span>
					</div>
					<select name="languages" multiple id="languages">
						{% for language in languages %}
						<option value="{{ language }}">{{ language }}</option>
						{% endfor %}
					</select>
				</div>

				<button type="submit" class="primary-btn">
					<span>Show Matches</span>
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<line x1="5" y1="12" x2="19" y2="12"></line>
						<polyline points="12 5 19 12 12 19"></polyline>
					</svg>
				</button>
			</form>
		</div>
	</div>

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
	<script>
		$(document).ready(function() {
			$('#titles').select2({
				placeholder: 'Search for types or titles (e.g. Breaking Bad)',
				allowClear: true,
				width: '100%',
				selectionCssClass: 'custom-select2-selection',
				dropdownCssClass: 'custom-select2-dropdown'
			});
			$('#languages').select2({
				placeholder: 'Search for languages (e.g. Spanish)',
				allowClear: true,
				width: '100%'
			});
		});
	</script>
</body>
</html>
